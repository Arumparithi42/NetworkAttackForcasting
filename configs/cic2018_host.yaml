# Host-centric world model on the two CSE-CIC-IDS2018 infiltration days, built from the raw
# per-host PCAPs (flow + packet-level features). Labels are transferred from the published CSV
# (see netwm/labels/match.py and docs/DATA_NOTES.md).
name: cic2018_host
entity: host
source: pcap_flows
flows_dir: data/interim/pcap_flows
raw_dir: data/raw/cic2018
interim_dir: data/interim/cic2018
processed_dir: data/processed/cic2018_host
artifact_dir: artifacts/cic2018_host
utc_offset_hours: -4
clock_12h_threshold: 8
internal_cidrs: ["172.31.0.0/16"]
with_packet: true
min_active_windows: 20                 # hosts active in fewer windows are dropped
capture_window_utc: ["12:00", "21:45"] # capture period (08:00-17:45 local)

files:
  "2018-02-28": Wednesday-28-02-2018_TrafficForML_CICFlowMeter.csv
  "2018-03-01": Thursday-01-03-2018_TrafficForML_CICFlowMeter.csv

label_matching:
  min_victim_matches: 100              # strict-key attack matches needed to call a host a victim
  source_outlier_factor: 5.0           # attack source: >= 5x the median of the top-10 source counts
  min_target_share: 0.75               # attack target: >= 75% of its matched incoming flows are attack

protocol: A
protocols:
  A:
    train: ["2018-02-28"]
    test: ["2018-03-01"]
    split_days: {}

validation:
  block_windows: 60
  every: 4
  offset: 2

sampling:
  benign_ratio: 5

train:
  batch_size: 512
  epochs: 25
